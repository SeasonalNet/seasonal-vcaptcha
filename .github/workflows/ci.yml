name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Install Python tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 python3-venv python3-pip
          python3 -m venv .venv-bootstrap
          . .venv-bootstrap/bin/activate
          python -m pip install --upgrade pip uv==0.13.5
          uv python install 3.15.1
          uv venv --python 3.15.1 .venv-ci
          uv pip install --python .venv-ci/bin/python -r requirements.txt
          uv pip install --python .venv-ci/bin/python -r requirements-dev.txt
          uv pip install --python .venv-ci/bin/python -e .
      - name: Audit locked Python dependencies
        run: .venv-bootstrap/bin/uv audit --locked --preview-features audit-command
      - name: Compile Python sources
        run: |
          . .venv-ci/bin/activate
          python -m compileall -q lib tests
      - name: Run tests
        run: |
          . .venv-ci/bin/activate
          python -m pytest

      - name: Verify Git-derived version
        run: |
          case "${GITHUB_REF:-}" in
            refs/tags/*) sh tools/version.sh --release "${GITHUB_REF#refs/tags/}" ;;
            *) sh tools/version.sh ;;
          esac
          sh tools/test-version.sh

  publish-container:
    name: Publish container image
    needs: [python]
    if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          owner="$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/$owner/seasonal-vcaptcha"
          version="$(sh tools/version.sh --release "$GITHUB_REF_NAME")"
          revision="$(sh tools/version.sh --revision)"
          build_date="$(git show -s --format=%cI HEAD)"
          image_tag="$(sh tools/version.sh --image-tag "$GITHUB_REF_NAME")"
          tags=(--tag "$image:sha-${GITHUB_SHA:0:12}")
          tags+=(--tag "$image:$image_tag")
          docker buildx build --platform linux/amd64 --push \
            --build-arg "APP_VERSION=$version" \
            --build-arg "APP_REVISION=$revision" \
            --build-arg "APP_BUILD_DATE=$build_date" "${tags[@]}" .
