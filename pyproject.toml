[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seasonal-vcaptcha"
version = "0.2.0"
description = "SeasonalPBX spoken digit CAPTCHA recognizer backed by Vosk"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "vosk",
]

[project.scripts]
seasonal-vcaptcha-digits = "seasonal_vcaptcha.cli:main"
seasonal-vcaptcha-daemon = "seasonal_vcaptcha.daemon:main"

[tool.setuptools]
package-dir = {"" = "lib"}

[tool.setuptools.packages.find]
where = ["lib"]

[tool.pytest.ini_options]
pythonpath = ["lib"]
testpaths = ["tests"]
