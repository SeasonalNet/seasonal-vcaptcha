[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "seasonal-vcaptcha"
dynamic = ["version"]
description = "SeasonalPBX spoken digit CAPTCHA recognizer backed by Vosk"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
  "PyYAML>=6.0",
  "vosk",
]

[project.scripts]
seasonal-vcaptcha-digits = "seasonal_vcaptcha.cli:main"
seasonal-vcaptcha-daemon = "seasonal_vcaptcha.daemon:main"

[tool.setuptools]
package-dir = {"" = "lib"}

[tool.setuptools_scm]
version_file = "lib/seasonal_vcaptcha/_version.py"
fallback_version = "0.0.0+unknown"

[tool.setuptools.packages.find]
where = ["lib"]

[tool.pytest.ini_options]
pythonpath = ["lib"]
testpaths = ["tests"]

[tool.uv]
required-version = "==0.13.5"
